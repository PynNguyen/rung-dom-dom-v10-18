<!-- Maintenance: duplicate legacy implementations removed; final renderer implementations are authoritative. Keep responsive HUD override consolidated at the end of the stylesheet. -->
<!-- V9.0 performance: conservative mobile DPR, adaptive quality tiers, and hidden-tab render pause. -->
<!-- V9.3: cache reusable glow sprites with bounded memory; preserve DPR and gameplay. -->
<!-- V9.1: mobile devices start at low FX; adaptive quality cannot promote them to expensive tier 0. -->
<!-- V9.1.1: Canvas DPR floor 1.0 prevents low-resolution upscaling blur. -->
<!-- V9.2: reuse Canvas gradients across frames; no quality reduction or content removal. -->
<!-- V9.3: reusable radial glow sprites; bounded cache avoids repeated gradient construction. -->

<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="num">0</div>
      <div id="rate">0/giây</div>
      <div id="badges"></div>
    </div>
    <button id="home" class="top-btn" title="Vào/Ra nhà (E)">🏠</button>
    <button id="wth" class="top-btn" title="Đổi thời tiết">🌙</button>
    <button id="snd" class="top-btn" title="Âm thanh">🔊</button>
    <div id="toast"></div>
    <div id="hint">Chạm thu thập · Vồ đom đóm x6 · Click đúp để nhảy · Kéo ngang để dạo bước</div>
    <div id="nav-bar">
      <button class="loc-pill on" data-loc="0"><span class="le">🏠</span><span class="ln"> Nhà gỗ</span></button>
      <button class="loc-pill" data-loc="1"><span class="le">🌲</span><span class="ln"> Rừng linh hồn</span></button>
      <button class="loc-pill" data-loc="2"><span class="le">💧</span><span class="ln"> Thác ngân hà</span></button>
      <button class="loc-pill" data-loc="3"><span class="le">🌙</span><span class="ln"> Hồ trăng</span></button>
    </div>
  </div>
  <aside id="panel">
    <button id="grab" aria-label="Thu gọn / mở rộng bảng"></button>
    <div id="panel-head">
      <nav id="tabs">
        <button data-t="0" class="on"><span class="te">🌿</span><span class="tl"> Phép màu</span></button>
        <button data-t="1"><span class="te">🐾</span><span class="tl"> Bạn rừng</span></button>
        <button data-t="3"><span class="te">🏠</span><span class="tl"> Tổ ấm</span></button>
        <button data-t="2"><span class="te">🏆</span><span class="tl"> Thành tựu</span></button>
        <button data-t="5"><span class="te">📖</span><span class="tl"> Sổ tay</span></button>
        <button data-t="4">⚙️</button>
      </nav>
      <button id="buy-mult" title="Chế độ mua">x1</button>
    </div>
    <div id="list"></div>
    <div id="ach"></div>
    <div id="cfg"></div>
    <div id="nb"></div>
  </aside>
</div>

<!-- RDD V9.6: consolidated presentation, audio and play-mode controls. Isolated add-on; core economy/render loop remains intact. -->
<link rel="stylesheet" href="css/11-rdd-v96-style.css">
<button id="rdd-v96-launch" type="button" aria-controls="rdd-v96-panel" aria-expanded="false"><span aria-hidden="true">✦</span> Chế độ chơi</button>
<section id="rdd-v96-panel" role="dialog" aria-modal="false" aria-labelledby="rdd-v96-title">
 <h2 id="rdd-v96-title">Tùy chỉnh trải nghiệm</h2><p class="v96-sub">Lưu riêng trên thiết bị này · Không thay đổi tiến trình hay công thức kinh tế.</p>
 <div class="v96-label"><span>Phong cách hình ảnh</span></div>
 <div class="v96-options" role="group" aria-label="Phong cách hình ảnh">
  <button type="button" data-v96-mode="balanced">🌿 Cân bằng</button><button type="button" data-v96-mode="cinematic">🌙 Điện ảnh</button><button type="button" data-v96-mode="performance">⚡ Mượt nhẹ</button>
 </div>
 <div class="v96-label"><span>Âm thanh & nhạc nền</span><span id="rdd-v96-audio-state">Theo cài đặt game</span></div>
 <div class="v96-options" role="group" aria-label="Âm thanh"><button type="button" data-v96-audio="on">🔊 Bật</button><button type="button" data-v96-audio="off">🔇 Tắt</button><button type="button" id="rdd-v96-test">♪ Thử âm</button></div>
 <div class="v96-label"><label for="rdd-v96-volume">Âm lượng</label><span id="rdd-v96-volume-value">70%</span></div>
 <input id="rdd-v96-volume" type="range" min="0" max="100" step="5" value="70" aria-label="Âm lượng tổng" />
 <div class="v96-label"><span>Chuyển động nền</span></div>
 <div class="v96-options" role="group" aria-label="Chuyển động nền"><button type="button" data-v96-motion="full">✨ Đầy đủ</button><button type="button" data-v96-motion="calm">🍃 Dịu nhẹ</button><button type="button" data-v96-motion="system">⚙️ Theo máy</button></div>
 <div class="v96-foot"><span id="rdd-v96-status" aria-live="polite">Sẵn sàng</span><button type="button" class="v96-close" id="rdd-v96-close">Đóng</button></div>
</section>
